# ha_mcp_backup
schema_version: 1
domain: automation
entity_id: '1794759560927'
captured: '2026-11-15T17:05:33.619862+00:00'
tool: ha_config_set_automation
config:
  id: '1794759560927'
  alias: "Bambu H2D - Registrer str\xF8mforbrug"
  description: "Registrerer energim\xE5lerens startv\xE6rdi ved printstart og beregner\
    \ str\xF8mforbruget ved afslutning. Bevarer registreringen ved genstart af Home\
    \ Assistant.\n"
  triggers:
  - trigger: state
    entity_id: sensor.h2d_0948db552101895_print_status
    to: prepare
    id: start
  - trigger: state
    entity_id: sensor.h2d_0948db552101895_print_status
    to: finish
    id: slut
  - trigger: homeassistant
    event: start
    id: genstart
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      - condition: state
        entity_id: input_boolean.h2d_print_aktiv
        state: 'off'
      - condition: template
        value_template: "{{ is_number(states(\n  'sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet'\n\
          )) }}\n"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.h2d_start_kwh
        data:
          value: "{{ states(\n  'sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet'\n\
            ) | float }}\n"
      - action: input_text.set_value
        target:
          entity_id: input_text.h2d_job_name
        data:
          value: "{{ states(\n  'sensor.h2d_0948db552101895_opgavenavn'\n)[:255] }}\n"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.h2d_print_aktiv
    - conditions:
      - condition: trigger
        id: slut
      - condition: state
        entity_id: input_boolean.h2d_print_aktiv
        state: 'on'
      - condition: template
        value_template: "{{ is_number(states(\n  'sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet'\n\
          )) }}\n"
      sequence:
      - variables:
          start_kwh: '{{ states(''input_number.h2d_start_kwh'') | float }}

            '
          slut_kwh: "{{ states(\n  'sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet'\n\
            ) | float }}\n"
      - variables:
          forbrug_kwh: "{{ (slut_kwh | float - start_kwh | float)\n   | round(4) }}\n"
      - if:
        - condition: template
          value_template: '{{ forbrug_kwh | float >= 0 }}'
        then:
        - action: system_log.write
          data:
            level: info
            message: "H2D print afsluttet. Job: {{ states('input_text.h2d_job_name')\
              \ }}. Str\xF8mforbrug: {{ forbrug_kwh }} kWh.\n"
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.h2d_print_aktiv
    - conditions:
      - condition: trigger
        id: genstart
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.h2d_print_aktiv
          state: 'on'
        then:
        - action: system_log.write
          data:
            level: info
            message: 'H2D: Home Assistant genstartet. Eksisterende printregistrering
              bevares.

              '
  mode: queued
  max: 5
