config:
  id: '1794776519957'
  alias: Alarmo - Nedis sirene (Alarm 7)
  description: "Alarm 7 i 5 sekunders pulser ved Alarmo triggered, h\xF8jst 5 minutter.\
    \ D\xF8rklokke ber\xF8res ikke. Skift data.duration fra 5 til 60 efter test; juster\
    \ ogs\xE5 delay for 60 sekunders pulser."
  triggers:
  - trigger: state
