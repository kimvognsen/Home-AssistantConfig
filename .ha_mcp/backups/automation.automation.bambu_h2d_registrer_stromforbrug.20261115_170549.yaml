      - condition: state
        entity_id: sensor.h2d_0948db552101895_print_status
        state: running
      sequence:
      - action: system_log.write
        data:
          level: warning
          message: "H2D er running uden aktiv printregistrering. Starter ikke midt\
            \ i print for at undg\xE5 misvisende totaler."
    - conditions:
      - condition: trigger
        id:
        - finish
        - failed
        - idle
      - condition: state
        entity_id: input_boolean.h2d_print_aktiv
        state: 'on'
      sequence:
