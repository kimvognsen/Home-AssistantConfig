      - action: input_number.set_value
        target:
          entity_id: input_number.h2d_sidst_afregnet_kwh
        data:
          value: '{{ states(''sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet'')
