  alias: Bambu P1S - Sluk efter færdigt print
  description: 'Slukker P1S tidligst 30 minutter efter et vellykket print, når dyse
    og byggeplade er kølet ned.

    '
  triggers:
  - trigger: state
    entity_id: sensor.ps1_01_print_status
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none\n   and trigger.from_state.state
      == 'Running'\n   and trigger.to_state is not none\n   and trigger.to_state.state
      == 'Finished' }}\n"
  actions:
  - delay: 00:30:00
  - wait_template: "{{\n  states('sensor.ps1_01_nozzle_temperature') | float(999)
      < 50\n  and\n  states('sensor.ps1_01_bed_temperature') | float(999) < 45\n}}\n"
  - condition: state
    entity_id: sensor.ps1_01_print_status
    state: Finished
  - action: switch.turn_off
    target:
      entity_id: switch.lvd_smart_plug_bambu_p1s
  mode: restart
- id: '1791636399833'
  alias: Carport – Automatisk styring af lyskæde
  description: 'Styrer carportens lyskæde ved solnedgang, brugerdefineret sluktidspunkt
    og morgenlys. Respekterer Party Mode. Indeholder failsafe, periodisk kontrol og
    HA-genstart.

    '
  triggers:
  - trigger: sun
    event: sunset
    id: sunset
  - trigger: time
    at: input_datetime.sluk_lyskaede_i_carport
    id: sluktid
  - trigger: time
    at: 06:30:00
    id: morgen
  - trigger: sun
    event: sunrise
    id: sunrise
  - trigger: time
    at: 09:00:00
    id: failsafe
  - trigger: state
    entity_id: input_boolean.party_mode
    from: 'on'
    to: 'off'
    id: party_off
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: state
    entity_id: input_datetime.sluk_lyskaede_i_carport
    id: sluktid_aendret
  - trigger: time_pattern
    minutes: /15
    id: kontrol
  conditions:
  - condition: state
    entity_id: input_boolean.party_mode
    state: 'off'
  actions:
  - variables:
      nu: '{{ now() }}'
      sluktid: '{{ today_at(states(''input_datetime.sluk_lyskaede_i_carport'')) }}

        '
      morgenperiode: "{{\n  today_at('06:30') <= now() < today_at('09:00')\n}}\n"
      moerkt: '{{ is_state(''sun.sun'', ''below_horizon'') }}

        '
      aftenperiode: "{{\n  is_state('sun.sun', 'below_horizon')\n  and now() >= today_at('12:00')\n
        \ and now() < today_at(\n    states('input_datetime.sluk_lyskaede_i_carport')\n
        \ )\n}}\n"
      skal_vaere_taendt: "{{\n  aftenperiode\n  or (morgenperiode and moerkt)\n}}\n"
  - if:
    - condition: template
      value_template: '{{ skal_vaere_taendt }}'
    then:
    - if:
      - condition: template
        value_template: '{{ not is_state(''light.hue_smart_plug_lyskaede'', ''on'')
          }}

          '
      then:
      - action: light.turn_on
        target:
          entity_id: light.hue_smart_plug_lyskaede
    else:
    - if:
      - condition: state
        entity_id: light.hue_smart_plug_lyskaede
        state: 'on'
      then:
      - action: light.turn_off
        target:
          entity_id: light.hue_smart_plug_lyskaede
  mode: restart
- id: '1791882644518'
  alias: Værksted V2 – Central varmestyring
  description: 'Central styring af elradiator. Respekterer sikkerhedsstop, frostbeskyttelse,
    fyringssæson, pris-pause og Boost.

    '
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /1
  - trigger: time
    at:
    - 09:00:00
    - '17:00:00'
    - '20:00:00'
  - trigger: state
    entity_id:
    - input_boolean.fyringssaeson
    - input_boolean.vaerksted_boost
    - input_boolean.vaerksted_sikkerhedsstop
    - input_boolean.vaerksted_frostbeskyttelse
    - input_number.vaerksted_temp_normal
    - input_number.vaerksted_temp_nat
    - input_number.vaerksted_temp_boost
  actions:
  - variables:
      temp: "{{ states(\n  'sensor.sonoff_snzb_02d_weather_sensor_vaerksted_temperature'\n)
        | float(none) }}\n"
      sikkerhedsstop: '{{ is_state(''input_boolean.vaerksted_sikkerhedsstop'', ''on'')
        }}

        '
      frost: '{{ is_state(''input_boolean.vaerksted_frostbeskyttelse'', ''on'') }}

        '
      fyring: '{{ is_state(''input_boolean.fyringssaeson'', ''on'') }}

        '
      boost: '{{ is_state(''input_boolean.vaerksted_boost'', ''on'') }}

        '
      pris_pause: '{{ 17 <= now().hour < 20 }}

        '
      setpunkt: "{% if is_state('input_boolean.vaerksted_boost', 'on') %}\n  {{ states('input_number.vaerksted_temp_boost')
        | float(20) }}\n{% elif now().hour >= 20 or now().hour < 9 %}\n  {{ states('input_number.vaerksted_temp_nat')
        | float(16.5) }}\n{% else %}\n  {{ states('input_number.vaerksted_temp_normal')
        | float(18) }}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ sikkerhedsstop or temp is none or temp >= 22 }}

          '
      sequence:
      - action: climate.turn_off
        target:
          entity_id: climate.vaerksted_termostat
    - conditions:
      - condition: template
        value_template: '{{ frost or temp <= 12 }}

          '
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.vaerksted_termostat
        data:
          temperature: 16
      - action: climate.turn_on
        target:
          entity_id: climate.vaerksted_termostat
    - conditions:
      - condition: template
        value_template: '{{ not fyring }}'
      sequence:
      - action: climate.turn_off
        target:
          entity_id: climate.vaerksted_termostat
    - conditions:
      - condition: template
        value_template: '{{ pris_pause and not boost }}'
      sequence:
      - action: climate.turn_off
        target:
          entity_id: climate.vaerksted_termostat
    default:
    - action: climate.set_temperature
      target:
        entity_id: climate.vaerksted_termostat
      data:
        temperature: '{{ setpunkt | float }}'
    - action: climate.turn_on
      target:
        entity_id: climate.vaerksted_termostat
  mode: restart
- id: '1791884056201'
  alias: Værksted V2 – Boost timer
  description: 'Starter og stopper Boost. Kontrollerer også timerens tilstand efter
    HA-genstart.

    '
  triggers:
  - trigger: state
    entity_id: input_boolean.vaerksted_boost
    to: 'on'
    id: boost_on
  - trigger: state
    entity_id: input_boolean.vaerksted_boost
    to: 'off'
    id: boost_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.vaerksted_boost_timer
    id: timer_finished
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: boost_on
      sequence:
      - action: timer.start
        target:
          entity_id: timer.vaerksted_boost_timer
    - conditions:
      - condition: trigger
        id: boost_off
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.vaerksted_boost_timer
    - conditions:
      - condition: trigger
        id: timer_finished
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vaerksted_boost
    - conditions:
      - condition: trigger
        id: startup
      sequence:
      - delay: 00:00:30
      - if:
        - condition: state
          entity_id: input_boolean.vaerksted_boost
          state: 'on'
        - condition: state
          entity_id: timer.vaerksted_boost_timer
          state: idle
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.vaerksted_boost
  mode: restart
- id: '1791884110680'
  alias: Værksted V2 – Sikkerhed og frostbeskyttelse
  description: 'Overvåger temperatur og sensor. Håndterer sikkerhedsstop og frostbeskyttelse.

    '
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id:
    - sensor.sonoff_snzb_02d_weather_sensor_vaerksted_temperature
  actions:
  - variables:
      temp: "{{ states(\n  'sensor.sonoff_snzb_02d_weather_sensor_vaerksted_temperature'\n)
        | float(none) }}\n"
      sikkerhedsstop: '{{ is_state(''input_boolean.vaerksted_sikkerhedsstop'', ''on'')
        }}

        '
      frost: '{{ is_state(''input_boolean.vaerksted_frostbeskyttelse'', ''on'') }}

        '
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ temp is none or temp >= 22 }}

          '
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.vaerksted_sikkerhedsstop
          state: 'off'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.vaerksted_sikkerhedsstop
        - action: notify.send_message
          target:
            entity_id: notify.kims_mobiltelefon
          data:
            message: 'Værksted: Sikkerhedsstop aktiveret. Temperatur: {{ temp if temp
              is not none else ''Sensorfejl'' }} °C.

              '
      - action: climate.turn_off
        target:
          entity_id:
          - climate.vaerksted_termostat
          - climate.el_radiator_i_varksted
    - conditions:
      - condition: template
        value_template: "{{ temp is not none\n   and temp < 21\n   and sikkerhedsstop
          }}\n"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vaerksted_sikkerhedsstop
    - conditions:
      - condition: template
        value_template: "{{ temp is not none\n   and temp <= 12\n   and not frost
          }}\n"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vaerksted_frostbeskyttelse
      - action: notify.send_message
        target:
          entity_id: notify.kims_mobiltelefon
        data:
          message: 'Værksted: Frostbeskyttelse aktiveret. Temperaturen er {{ temp
            }} °C.

            '
    - conditions:
      - condition: template
        value_template: "{{ temp is not none\n   and temp >= 16\n   and frost }}\n"
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vaerksted_frostbeskyttelse
  mode: restart
- id: '1791884174662'
  alias: Værksted V2 – Radiator watchdog
  description: 'Kontrollerer at Tuya-radiatoren er slukket, når sikkerhedsstop er
    aktivt.

    '
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: input_boolean.vaerksted_sikkerhedsstop
    state: 'on'
  - condition: state
    entity_id: climate.el_radiator_i_varksted
    state: heat
  actions:
  - action: climate.turn_off
    target:
      entity_id:
      - climate.vaerksted_termostat
      - climate.el_radiator_i_varksted
  - delay: 00:00:10
  - if:
    - condition: state
      entity_id: climate.el_radiator_i_varksted
      state: heat
    then:
    - action: notify.send_message
      target:
        entity_id: notify.kims_mobiltelefon
      data:
        message: 'ADVARSEL: Værkstedets radiator reagerer ikke på slukkommandoen.
          Kontroller radiatoren.

          '
  mode: single
- id: '1794410163337'
  alias: Værksted V2 – Overvågning af luftfugtighed
  description: 'Overvåger fugtigheden i værkstedet. Sender én advarsel efter 60 minutter
    over 70 % RH. Nulstiller ved 65 % RH eller lavere. Robust ved genstart af Home
    Assistant.

    '
  triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - sensor.sonoff_snzb_02d_weather_sensor_vaerksted_humidity
  actions:
  - variables:
      fugt: "{{ states('sensor.sonoff_snzb_02d_weather_sensor_vaerksted_humidity')\n
        \  | float(none) }}\n"
      sendt: '{{ is_state(''input_boolean.vaerksted_fugtadvarsel_sendt'', ''on'')
        }}

        '
      start_tid: "{{ as_timestamp(\n     states('input_datetime.vaerksted_fugt_hoej_siden'),
        0\n   ) }}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ fugt is none }}'
      sequence:
      - stop: Fugtsensor er ikke tilgængelig
    - conditions:
      - condition: template
        value_template: '{{ fugt <= 65 }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vaerksted_fugtadvarsel_sendt
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.vaerksted_fugt_hoej_siden
        data:
          datetime: '1970-01-01 00:00:00'
    - conditions:
      - condition: template
        value_template: '{{ fugt > 70 and start_tid < 100000 }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.vaerksted_fugt_hoej_siden
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - conditions:
      - condition: template
        value_template: "{{ fugt > 70\n   and not sendt\n   and start_tid > 100000\n
          \  and (as_timestamp(now()) - start_tid) >= 3600 }}\n"
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vaerksted_fugtadvarsel_sendt
      - action: notify.send_message
        target:
          entity_id: notify.kims_mobiltelefon
        data:
          message: "\U0001F4A7 Værksted: Høj luftfugtighed!\nLuftfugtighed: {{ fugt
            | round(1) }} %.\nLuftfugtigheden har været over 70 % i mindst 60 minutter.\nOvervej
            at aktivere affugteren.\n"
  mode: queued
  max: 3
- id: '1794413119252'
  alias: Sluk Sonos i stuen efter 1 time uden aktivitet v2
  description: Slukker strømmen 1 time efter både Apple TV og Sonos er stoppet
  triggers:
  - trigger: state
    entity_id: media_player.apple_tv_stuen
    from: playing
    for: 01:00:00
  - trigger: state
    entity_id:
    - media_player.stue_arc
    from:
    - playing
    for: 01:00:00
  conditions:
  - condition: state
    entity_id: switch.sonos_stuen
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.apple_tv_stuen
      state: playing
    - condition: state
      entity_id: media_player.stue_arc
      state:
      - playing
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.sonos_stuen
  mode: single
- id: '1794413361994'
  alias: Sluk Sonos i køkken efter 1 time uden aktivitet V2
  description: Slukker strømmen 1 time efter både Apple TV og Sonos er stoppet
  triggers:
  - trigger: state
    entity_id: media_player.apple_tv_kokken
    from: playing
    for: 01:00:00
  - trigger: state
    entity_id: media_player.kokken_hojtaler
    from: playing
    for: 01:00:00
  - trigger: state
    entity_id: switch.symfonisk_kokken
    to: 'on'
    for: 01:00:00
  conditions:
  - condition: state
