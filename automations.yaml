- id: '1794776519957'
  alias: Alarmo - Nedis sirene (Alarm 7)
  description: Alarm 7, 5 sekunder pr. puls, højst 5 minutter fra oprindelig udløsning.
    Alarmstart gemmes og overlever HA-genstart. Dørklokke uændret.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: triggered
    id: alarm
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: disarmed
    id: stop
  - trigger: homeassistant
    event: start
    id: startup
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - action: siren.turn_off
        target:
          entity_id: siren.bryggers_sirene
    default:
    - if:
      - condition: trigger
        id: alarm
      then:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.alarmo_sirene_alarmstart
        data:
          timestamp: '{{ now().timestamp() }}'
    - if:
      - condition: trigger
        id: startup
      then:
      - delay: 00:00:20
    - if:
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: triggered
      - condition: template
        value_template: '{{ 0 <= (as_timestamp(now()) - as_timestamp(states(''input_datetime.alarmo_sirene_alarmstart''),
          0)) < 300 }}'
      then:
      - repeat:
          while:
          - condition: state
            entity_id: alarm_control_panel.alarmo
            state: triggered
          - condition: template
            value_template: '{{ 0 <= (as_timestamp(now()) - as_timestamp(states(''input_datetime.alarmo_sirene_alarmstart''),
              0)) < 300 }}'
          sequence:
          - action: siren.turn_on
            target:
              entity_id: siren.bryggers_sirene
            data:
              tone: Alarm 7
              duration: 5
          - delay: 00:00:05
    - action: siren.turn_off
      target:
        entity_id: siren.bryggers_sirene
  mode: restart
