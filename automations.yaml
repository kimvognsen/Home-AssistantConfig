      state: playing
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.symfonisk_kokken
  mode: single
- id: '1794415556821'
  alias: Sluk Sonos i køkken efter 1 time uden aktivitet V3
  description: Slukker strømmen 1 time efter både Apple TV og Sonos er stoppet
  triggers:
  - trigger: state
    entity_id:
    - media_player.apple_tv_kokken
