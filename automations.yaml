- id: '1751886897930'
  alias: Notifikation – valgte rum
  description: Sender notifikation når en valgt sensor trigges og home_alone = on
  triggers:
  - entity_id:
    - binary_sensor.dor_sensor_stuen_contact
    - binary_sensor.ikea_vallhorn_hall_occupancy
    - binary_sensor.hue_outdoor_motion_sensor_hovedindgang_bevaegelse
    - binary_sensor.aqara_p1_motion_sensor_bryggers_occupancy
    - binary_sensor.hue_outdoor_sensor_indkoersel_bevaegelse
    - binary_sensor.hue_outdoor_sensor_terrasse_bevaegelse
    - binary_sensor.motion_sensor_entre_occupancy
    - binary_sensor.dor_sensor_vaerksted_contact
    - binary_sensor.dor_sensor_entre_contact
    - binary_sensor.sonoff_dor_sensor_bryggers_contact
    - binary_sensor.vindue_sensor_badevaerelse_contact
    - binary_sensor.vindue_sensor_sovevaerelse_contact
    - binary_sensor.vindue_sensor_jonatans_vaerelse_contact
    - binary_sensor.vindue_sensor_matias_vaerelse_contact
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.home_alone
    state: 'on'
  - condition: template
    value_template: "{% set map = {\n  'binary_sensor.dor_sensor_stuen_contact':        'input_boolean.stuen_motion',\n
      \ 'binary_sensor.ikea_vallhorn_hall_occupancy':         'input_boolean.hall_motion',\n
      \ 'binary_sensor.hue_outdoor_motion_sensor_hovedindgang_bevaegelse': 'input_boolean.hovedindgang_motion',\n
      \ 'binary_sensor.aqara_p1_motion_sensor_bryggers_occupancy':            'input_boolean.bryggers_motion',\n
      \ 'binary_sensor.hue_outdoor_sensor_indkoersel_bevaegelse':      'input_boolean.indkoersel_motion',\n
      \ 'binary_sensor.hue_outdoor_sensor_terrasse_bevaegelse':        'input_boolean.terrasse_motion',\n
      \ 'binary_sensor.motion_sensor_entre_occupancy':         'input_boolean.entre_motion',\n
      \ 'binary_sensor.motion_sensor_vaerksted_occupancy':            'input_boolean.vaerksted_motion',\n
      \ 'binary_sensor.dor_sensor_vaerksted_contact':        'input_boolean.stuen_dor',\n
      \ '':   'input_boolean.entre_dor',\n  'binary_sensor.sonoff_dor_sensor_bryggers_contact':
      'input_boolean.bryggers_dor',\n  'binary_sensor.dor_sensor_vaerksted_contact':
      \       'input_boolean.vaerksteds_dor',\n  'binary_sensor.vindue_sensor_badevaerelse_contact':
      \       'input_boolean.badevaerelses_vindue',\n  'binary_sensor.vindue_sensor_sovevaerelse_contact':
      \       'input_boolean.sovevaerelses_vindue',\n  'binary_sensor.vindue_sensor_jonatans_vaerelse_contact':
      \       'input_boolean.jonatan_vindue',\n  'binary_sensor.vindue_sensor_matias_vaerelse_contact':
      \       'input_boolean.matias_vindue'\n} %} {{ is_state(map[trigger.entity_id],
      'on') }}\n"
  actions:
  - action: notify.mobile_app_kims_iphone17
    data:
      message: Nogen i huset
  mode: single
- id: '1752061213091'
  alias: Notifikation – valgte rum - test
  description: Sender notifikation når valgt sensor trigges og home_alone = on
  triggers:
  - entity_id:
    - binary_sensor.dor_sensor_stuen_contact
    - binary_sensor.ikea_vallhorn_hall_occupancy
    - binary_sensor.aqara_p1_motion_sensor_bryggers_occupancy
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.home_alone
    state: 'on'
  - condition: template
    value_template: "{%- set helpers = {\n   'binary_sensor.dor_sensor_stuen_contact':
      'input_boolean.stuen_motion',\n   'binary_sensor.ikea_vallhorn_hall_occupancy':
