      < 50\n  and\n  states('sensor.h2d_0948db552101895_bed_temperatur') | float(999)
      < 35\n}}\n"
  - condition: state
    entity_id: sensor.h2d_0948db552101895_print_status
    state: Finished
  - condition: state
    entity_id: binary_sensor.h2d_0948db552101895_hms_fejl
    state: 'off'
  - condition: state
    entity_id: binary_sensor.h2d_0948db552101895_print_fejl
    state: 'off'
  - action: switch.turn_off
    target:
      entity_id: switch.lvd_smart_plug_bambu_h2d
  mode: restart
