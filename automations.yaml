    conditions:
    - condition: state
      entity_id: media_player.apple_tv_kokken
      state: playing
    - condition: state
      entity_id: media_player.kokken_hojtaler
      state: playing
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.symfonisk_kokken
  mode: single
- id: '1794759560927'
  alias: Bambu H2D - Registrer strømforbrug
  description: Start ved prepare, afregn energidelta med aktuel EDS-pris, håndter
    pauser, afslutning og genstart. Et igangværende print uden aktiv registrering
    overtages ikke midt i jobbet.
  triggers:
  - trigger: state
    entity_id: sensor.h2d_0948db552101895_print_status
    to: prepare
    id: start
  - trigger: state
    entity_id: sensor.h2d_0948db552101895_print_status
    to: running
    id: running
  - trigger: state
    entity_id: sensor.h2d_0948db552101895_print_status
    to: finish
    id: finish
  - trigger: state
    entity_id: sensor.h2d_0948db552101895_print_status
    to: failed
    id: failed
  - trigger: state
    entity_id: sensor.h2d_0948db552101895_print_status
    to: idle
    id: idle
  - trigger: state
    entity_id: sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet
    id: afregn
  - trigger: state
    entity_id: sensor.eds_pris_dkk_kwh
    id: afregn
  - trigger: time_pattern
    minutes: /1
    id: afregn
  - trigger: homeassistant
    event: start
    id: genstart
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      - condition: state
        entity_id: input_boolean.h2d_print_aktiv
        state: 'off'
      sequence:
      - condition: numeric_state
        entity_id: sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet
        above: -1.0e-05
      - condition: numeric_state
        entity_id: sensor.eds_pris_dkk_kwh
        above: -1.0e-05
      - action: input_number.set_value
        target:
          entity_id: input_number.h2d_start_kwh
        data:
          value: '{{ states(''sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet'')
            | float }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.h2d_sidst_afregnet_kwh
        data:
          value: '{{ states(''sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet'')
            | float }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.h2d_akkumuleret_printpris
        data:
          value: 0
      - action: input_text.set_value
        target:
          entity_id: input_text.h2d_job_name
        data:
          value: '{{ states(''sensor.h2d_0948db552101895_opgavenavn'')[:100] }}'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.h2d_print_aktiv
    - conditions:
      - condition: trigger
        id: running
      - condition: state
        entity_id: input_boolean.h2d_print_aktiv
        state: 'off'
      - condition: state
        entity_id: sensor.h2d_0948db552101895_print_status
        state: running
      sequence:
      - action: system_log.write
        data:
          level: warning
          message: H2D er running uden aktiv printregistrering. Starter ikke midt
            i print for at undgå misvisende totaler.
    - conditions:
      - condition: trigger
        id:
        - finish
        - failed
        - idle
      - condition: state
        entity_id: input_boolean.h2d_print_aktiv
        state: 'on'
      sequence:
      - condition: numeric_state
        entity_id: sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet
        above: -1.0e-05
      - condition: numeric_state
        entity_id: sensor.eds_pris_dkk_kwh
        above: -1.0e-05
      - variables:
          current_kwh: '{{ states(''sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet'')
            | float }}'
          previous_kwh: '{{ states(''input_number.h2d_sidst_afregnet_kwh'') | float
            }}'
          rate: '{{ states(''sensor.eds_pris_dkk_kwh'') | float }}'
          old_cost: '{{ states(''input_number.h2d_akkumuleret_printpris'') | float
            }}'
      - variables:
          delta_kwh: '{{ [current_kwh | float - previous_kwh | float, 0] | max }}'
          new_cost: '{{ (old_cost | float + ([current_kwh | float - previous_kwh |
            float, 0] | max) * rate | float) | round(4) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.h2d_akkumuleret_printpris
        data:
          value: '{{ new_cost }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.h2d_sidst_afregnet_kwh
        data:
          value: '{{ current_kwh }}'
      - variables:
          total_kwh: '{{ [states(''sensor.vaerksted_lvd_smart_plug_bambu_h2d_h2d_energiforbrug_beregnet'')
            | float - states(''input_number.h2d_start_kwh'') | float, 0] | max | round(4)
            }}'
          total_cost: '{{ states(''input_number.h2d_akkumuleret_printpris'') | float
            | round(4) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.h2d_seneste_print_kwh
        data:
          value: '{{ total_kwh }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.h2d_seneste_print_pris
        data:
          value: '{{ total_cost }}'
      - action: system_log.write
        data:
          level: info
          message: 'H2D print afsluttet ({{ states(''sensor.h2d_0948db552101895_print_status'')
            }}). Job: {{ states(''input_text.h2d_job_name'') }}. Forbrug: {{ total_kwh
            }} kWh. Pris: {{ total_cost }} kr.'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.h2d_print_aktiv
    - conditions:
      - condition: trigger
        id: afregn
      - condition: state
        entity_id: input_boolean.h2d_print_aktiv
        state: 'on'
      sequence:
      - condition: numeric_state
