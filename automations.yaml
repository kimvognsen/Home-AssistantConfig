  description: ''
  triggers:
  - topic: zigbee2mqtt/Ikea_dimmer_til højtaler_i_køkken/action
    trigger: mqtt
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action == ''toggle'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: switch.dobbelt_udtag_energimaler_socket_1
            state: 'off'
          - condition: state
            entity_id: switch.dobbelt_udtag_energimaler_socket_2
            state: 'off'
          sequence:
          - repeat:
              count: 3
              sequence:
              - target:
                  entity_id: switch.dobbelt_udtag_energimaler_socket_1
                continue_on_error: true
                action: switch.turn_on
              - target:
                  entity_id: switch.dobbelt_udtag_energimaler_socket_2
                continue_on_error: true
                action: switch.turn_on
              - delay: 00:00:01
              - choose:
                - conditions:
                  - condition: or
                    conditions:
                    - condition: state
                      entity_id: switch.dobbelt_udtag_energimaler_socket_1
                      state: 'on'
                    - condition: state
                      entity_id: switch.dobbelt_udtag_energimaler_socket_2
                      state: 'on'
                  sequence:
                  - stop: Mindst én socket er tændt
        - conditions: []
          sequence:
          - target:
              entity_id: media_player.kokken_hojtaler
            action: media_player.media_play_pause
    - conditions:
      - condition: template
        value_template: '{{ action == ''arrow_right_click'' }}'
      sequence:
      - target:
          entity_id: media_player.kokken_hojtaler
        action: media_player.media_next_track
    - conditions:
      - condition: template
        value_template: '{{ action == ''arrow_left_click'' }}'
      sequence:
      - target:
          entity_id: media_player.kokken_hojtaler
        action: media_player.media_previous_track
    - conditions:
      - condition: template
        value_template: '{{ action == ''brightness_up_click'' }}'
      sequence:
      - target:
          entity_id: media_player.kokken_hojtaler
        action: media_player.volume_up
    - conditions:
      - condition: template
        value_template: '{{ action == ''brightness_down_click'' }}'
      sequence:
      - target:
          entity_id: media_player.kokken_hojtaler
        action: media_player.volume_down
    - conditions:
      - condition: template
        value_template: '{{ action in [''brightness_up_hold'', ''brightness_up_press'']
          }}'
      sequence:
      - repeat:
          sequence:
          - target:
              entity_id: media_player.kokken_hojtaler
            action: media_player.volume_up
          - wait_for_trigger:
            - topic: zigbee2mqtt/Ikea_dimmer_til højtaler_i_køkken/action
              payload: brightness_up_release
              trigger: mqtt
            - topic: zigbee2mqtt/Ikea_dimmer_til højtaler_i_køkken/action
              payload: brightness_stop
              trigger: mqtt
            timeout:
              milliseconds: '{{ ramp_delay_ms }}'
            continue_on_timeout: true
          until:
          - condition: template
            value_template: '{{ wait.trigger is not none }}'
          - condition: template
            value_template: '{{ repeat.index * (ramp_delay_ms/1000) >= max_ramp_seconds
              }}'
    - conditions:
      - condition: template
        value_template: '{{ action in [''brightness_down_hold'', ''brightness_down_press'']
          }}'
      sequence:
      - repeat:
          sequence:
          - target:
              entity_id: media_player.kokken_hojtaler
            action: media_player.volume_down
          - wait_for_trigger:
            - topic: zigbee2mqtt/Ikea_dimmer_til højtaler_i_køkken/action
              payload: brightness_down_release
              trigger: mqtt
            - topic: zigbee2mqtt/Ikea_dimmer_til højtaler_i_køkken/action
              payload: brightness_stop
              trigger: mqtt
            timeout:
              milliseconds: '{{ ramp_delay_ms }}'
            continue_on_timeout: true
          until:
          - condition: template
            value_template: '{{ wait.trigger is not none }}'
          - condition: template
            value_template: '{{ repeat.index * (ramp_delay_ms/1000) >= max_ramp_seconds
              }}'
  mode: restart
  variables:
    action: '{{ trigger.payload | default('''') }}'
    ramp_delay_ms: 180
    max_ramp_seconds: 8
