- binary_sensor:
    - name: "Værkstedsdør"
      unique_id: vaerkstedsdor_laas_status
      device_class: lock
      state: >
        {{ is_state(
          'binary_sensor.dorlas_vaerksted_water_leak_water_leak',
          'off'
        ) }}
      availability: >
        {{ states(
          'binary_sensor.dorlas_vaerksted_water_leak_water_leak'
        ) not in ['unknown', 'unavailable']
        }}


