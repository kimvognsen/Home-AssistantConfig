- sensor:
    - name: "Badeværelse – strømforbrug"
      unique_id: badevaerelse_stromforbrug_w
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set ents = expand(area_entities('badevaerelse')) %}
        {% set ids =
          (ents
            | rejectattr('state', 'in', ['unknown','unavailable','none',''])
            | selectattr('attributes.unit_of_measurement', 'eq', 'W')
            | map(attribute='entity_id') | list)
          +
          (ents
            | rejectattr('state', 'in', ['unknown','unavailable','none',''])
            | selectattr('attributes.device_class', 'eq', 'power')
            | map(attribute='entity_id') | list)
        %}
        {% set all = ids | unique | list %}
        {{ all | map('states') | map('float', 0) | sum | round(0) }}

