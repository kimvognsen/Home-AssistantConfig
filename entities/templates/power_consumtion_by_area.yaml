- sensor:
    - name: "Badeværelse – strømforbrug"
      unique_id: badevaerelse_stromforbrug_w
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set power_sensors =
          expand(area_entities('badevaerelse'))
          | rejectattr('entity_id', 'eq', this.entity_id)
          | selectattr('attributes.device_class', 'eq', 'power')
          | selectattr('attributes.unit_of_measurement', 'eq', 'W')
          | rejectattr('state', 'in', ['unknown', 'unavailable', 'none', ''])
          | list
        %}
        {{
          power_sensors
          | map(attribute='state')
          | map('float', 0)
          | sum
          | round(0)
        }}

