- sensor:
    - name: "Badeværelse – kr/time nu"
      unique_id: badevaerelse_kr_time_nu
      unit_of_measurement: "kr/t"
      state_class: measurement
      state: >
        {% set w = states('sensor.badevaerelse_stromforbrug') | float(0) %}
        {% set p = states('sensor.energi_data_service') %}
        {% if p not in ['unknown','unavailable','none',''] %}
          {{ ((w/1000) * (p|float(0))) | round(2) }}
        {% else %}
          unknown
        {% endif %}

