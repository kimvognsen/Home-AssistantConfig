- sensor:
    # ---- Justér disse 2 værdier ----
    - name: "Elpris nu (kr/kWh) – beregnet"
      unique_id: elpris_nu_kr_per_kwh_beregnet
      unit_of_measurement: "kr/kWh"
      state_class: measurement
      state: >
        {# 1) Sæt din EDS-pris-sensor her #}
        {% set price_entity = 'sensor.ENERGI_DATA_SERVICE_PRIS_HER' %}

        {# 2) Hvis din EDS er i øre/kWh: sæt true, ellers false #}
        {% set price_is_ore = false %}

        {# 3) Fast tarif i kr/kWh (eksempel: 0.132). Sæt 0 hvis du ikke vil medtage #}
        {% set tariff_kr_per_kwh = 0.0 %}

        {% set p = states(price_entity) | float(0) %}
        {% if price_is_ore %}
          {{ ((p / 100) + tariff_kr_per_kwh) | round(3) }}
        {% else %}
          {{ (p + tariff_kr_per_kwh) | round(3) }}
        {% endif %}

    # ---- Total: kr/time lige nu (baseret på Frient total power) ----
    - name: "Hus – kr/time nu"
      unique_id: hus_kr_per_time_nu
      unit_of_measurement: "kr/t"
      state_class: measurement
      state: >
        {% set w = states('sensor.frient_energiforbrug_total_power') | float(0) %}
        {% set kr_per_kwh = states('sensor.elpris_nu_kr_per_kwh_beregnet') | float(0) %}
        {{ ((w / 1000) * kr_per_kwh) | round(2) }}

    # ---- Total: kWh (Frient) er allerede kWh, men gør den "statistik-klar" hvis du vil ----
    - name: "Hus – energi (kWh) – statistik"
      unique_id: hus_energi_kwh_statistik
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      state: >
        {{ states('sensor.frient_energiforbrug_total_energy') | float(0) }}

    # ---- Kr/time pr. rum (brug dine rum-power sensorer) ----
