
- sensor:

  - name: "Jonatan forecast kWh/år"
    unique_id: jonatan_forecast_kwh_year
    unit_of_measurement: "kWh"
    device_class: energy
    state: >
      {% set ytd = states('sensor.jonatans_yearly_energy')|float(0) %}
      {% set day = now().timetuple().tm_yday %}
      {{ (ytd / max(day,1) * 365) | round(1) }}

  - name: "Matias forecast kWh/år"
    unique_id: matias_forecast_kwh_year
    unit_of_measurement: "kWh"
    device_class: energy
    state: >
